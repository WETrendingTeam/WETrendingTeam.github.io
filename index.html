<script>
(function () {
    const btn = document.getElementById("hubMenuBtn");
    const menu = document.getElementById("hubMenu");

    if (!btn || !menu) return;

    btn.addEventListener("click", function (e) {
        e.stopPropagation();
        const open = menu.classList.toggle("open");
        btn.setAttribute("aria-expanded", String(open));
        menu.setAttribute("aria-hidden", String(!open));
        btn.textContent = open ? "✕" : "☰";
    });

    document.addEventListener("click", function (e) {
        if (!menu.contains(e.target) && !btn.contains(e.target)) {
            menu.classList.remove("open");
            btn.setAttribute("aria-expanded", "false");
            menu.setAttribute("aria-hidden", "true");
            btn.textContent = "☰";
        }
    });
})();
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const toggle = document.getElementById("managementToggle");
    const submenu = document.getElementById("managementSubmenu");
    const arrow = document.getElementById("managementArrow");

    if (!toggle || !submenu) return;

    toggle.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();

        const isOpen = submenu.classList.contains("open");
        submenu.classList.toggle("open", !isOpen);
        toggle.setAttribute("aria-expanded", String(!isOpen));
        if (arrow) arrow.textContent = isOpen ? "▾" : "▴";
    });

    submenu.addEventListener("click", function (event) {
        event.stopPropagation();
    });

    document.addEventListener("click", function () {
        submenu.classList.remove("open");
        toggle.setAttribute("aria-expanded", "false");
        if (arrow) arrow.textContent = "▾";
    });
});
</script>
