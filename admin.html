<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WETrendingTeam Control Center</title>

<link rel="stylesheet" href="admin.css">

</head>


<body>


<div class="login-container">


<div class="login-card">


<img src="images/logo.png" class="logo" alt="WETrendingTeam Logo">


<h1>WETrendingTeam</h1>

<h2>Control Center</h2>


<p class="description">
Secure access for authorized personnel only.
</p>



<div class="role-selector">


<div class="role-card active" data-role="developer">
Developer
</div>


<div class="role-card" data-role="admin">
Admin
</div>


<div class="role-card" data-role="moderator">
Moderator
</div>


</div>




<form id="loginForm">


<label>Email</label>

<input 
type="email"
id="email"
placeholder="Enter your email"
required>



<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter your password"
required>



<label class="remember">

<input type="checkbox" id="remember">

Remember me

</label>



<button type="submit">
Login
</button>


</form>



<footer>

<p>Version 1.0</p>

<p>
© 2026 WETrendingTeam
</p>

</footer>



</div>


</div>

<script type="module" src="admin.js"></script>

</body>
</html>
