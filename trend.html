<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Trend Studio</title>

<link
rel="stylesheet"
href="trend.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>



<!-- ==========================
HEADER
========================== -->

<header class="topbar">

<div class="brand">

<h1>

Trend Studio

</h1>

<span>

Campaign Generator

</span>

</div>



<div class="header-actions">

<button
id="themeBtn"
class="icon-btn">

🌙

</button>



<button
id="menuBtn"
class="icon-btn">

☰

</button>

</div>

</header>



<!-- ==========================
APP
========================== -->

<div class="app">



<!-- ==========================
SIDEBAR
========================== -->

<aside
class="sidebar"
id="sidebar">

<div class="sidebar-header">

Generator

</div>



<nav class="tool-list">

<button
class="tool active">

Phrases

</button>

<button
class="tool">

K-Pop Group

</button>

<button
class="tool">

K-Pop Artist

</button>

<button
class="tool">

T-Pop Group

</button>

<button
class="tool">

Movies

</button>

<button
class="tool">

BL/GL Series

</button>

<button
class="tool">

BL Actors

</button>

<button
class="tool">

GL Actors

</button>

<button
class="tool">

Music

</button>

<button
class="tool">

Mobile App

</button>

<button
class="tool">

Sports

</button>

</nav>

</aside>



<!-- ==========================
WORKSPACE
========================== -->

<main class="workspace">

<h2
id="pageTitle">

Generate Phrases

</h2>

<!-- ==========================
CAMPAIGN
========================== -->

<section class="panel">

<div class="panel-header">

<h3>

Campaign

</h3>

</div>


<div class="field">

<label>

Campaign Name

</label>

<input
type="text"
id="campaignInput"
placeholder="WilliamEst Concert">

</div>



<div class="field-row">

<div class="field grow">

<label>

Keywords

</label>

<input
type="text"
id="keywordInput"
placeholder="#WilliamEst   #วิลเลี่ยมเอส">

</div>



<div class="field small">

<label>

Links

</label>

<select
id="linkCount">

<option>5</option>

<option selected>10</option>

<option>15</option>

<option>20</option>

<option>30</option>

<option>40</option>

<option>50</option>

</select>

</div>

</div>

</section>



<!-- ==========================
PUBLISHING
========================== -->

<section class="panel">

<div class="panel-header">

<h3>

Publishing

</h3>

</div>



<div class="field">

<label>

Platform

</label>

<div class="pill-group"
id="platformGroup">

<button
class="selected">

X

</button>

<button>

Instagram

</button>

<button>

YouTube

</button>

</div>

</div>



<div class="field">

<label>

Post Type

</label>

<div class="pill-group"
id="typeGroup">

<button
class="selected">

Post

</button>

<button>

Reply

</button>

<button>

Quote

</button>

</div>

</div>

</section>

<!-- ==========================
URL MANAGER
========================== -->

<section class="panel">

<div class="panel-header">

<h3>

URLs

</h3>

</div>

<div id="urlContainer">

</div>

<button
type="button"
id="addUrlBtn"
class="secondary-btn">

+ Add URL

</button>

</section>



<!-- ==========================
GENERATE
========================== -->

<section class="generate-section">

<button
id="generateBtn"
class="generate-btn">

Generate Campaign

</button>

</section>



<!-- ==========================
RESULTS
========================== -->

<section
id="results"
class="results">

<div class="results-header">

<h3>

Campaign Output

</h3>

</div>


<div class="campaign-actions">

<button id="clearBtn">
Clear Campaign
</button>

<button class="copy-all">
Copy All Intent Links
</button>

</div>

<div
id="resultsContainer">

</div>

</section>



</main>

</div>



<script src="trend.js"></script>

</body>

</html>
