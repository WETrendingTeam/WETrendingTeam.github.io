name: Deploy WETrendingTeam to Firebase

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 1. CHECKOUT PROJECT
      # ==============================
      - name: Checkout
        uses: actions/checkout@v4


      # ==============================
      # 2. SETUP NODE.JS 22
      # ==============================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ==============================
      # 3. AUTHENTICATE GOOGLE CLOUD
      # ==============================
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'


      # ==============================
      # 4. INSTALL FIREBASE CLI
      # ==============================
      - name: Install Firebase CLI
        run: npm install -g firebase-tools


      # ==============================
      # 5. INSTALL FUNCTIONS DEPENDENCIES
      # ==============================
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install


      # ==============================
      # 6. VERIFY FUNCTIONS DEPENDENCIES
      # ==============================
      - name: Verify Functions dependencies
        working-directory: functions
        run: |
          npm list firebase-functions
          npm list firebase-admin


      # ==============================
      # 7. DIAGNOSE FIREBASE FUNCTIONS ACCESS
      # ==============================
      - name: Diagnose Firebase Functions access
        run: |
          firebase functions:list \
            --project wetrendingteam-1f8ce \
            --debug


      # ==============================
      # 8. DEPLOY FIREBASE
      # ==============================
      - name: Deploy Firebase
        run: |
          firebase deploy \
            --project wetrendingteam-1f8ce \
            --only hosting,functions,firestore:rules \
            --debug
