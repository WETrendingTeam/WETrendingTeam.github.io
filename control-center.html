<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WETrendingTeam Control Center</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="login-container">
  <div class="login-card">
    <img src="images/brand/logo.png" class="logo" alt="WETrendingTeam Logo">
    <h1>WETrendingTeam</h1>
    <h2>Control Center &amp; Updates</h2>
    <p class="description">Secure access for authorized management.</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email"
             autocomplete="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password"
             autocomplete="current-password" required>

      <label class="remember">
        <input type="checkbox" id="remember"> Remember me
      </label>

      <button type="submit" id="loginButton">Login</button>
      <p id="controlResetLink" class="forgot-password"><a href="#" id="controlResetLink">Forgot password?</a></p>
      <p id="loginStatus" class="login-status" aria-live="polite"></p>
    </form>

    <footer>
      <p>Authorized account: <strong>lade.galleria…</strong></p>
      <p>© 2026 WETrendingTeam</p>
    </footer>
  </div>
</div>
<script type="module" src="control-center.js"></script>
</body>
</html>
